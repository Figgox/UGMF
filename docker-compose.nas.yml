# Paste-and-go UGMF for a NAS. This is the only file you need — no source
# checkout, no Dockerfile, no build. It pulls a prebuilt image that is already
# published and public, so there is no login or token to set up.
#
# The image is multi-platform (linux/amd64 + linux/arm64), so Docker picks the
# right build for your hardware. Around 74 MB to pull.
#
# Save this anywhere on the NAS and run:
#
#   docker compose -f docker-compose.nas.yml up -d
#
# Or save it as plain docker-compose.yml and the -f becomes unnecessary.
# Then open http://<your-nas-ip>:3000

services:
  ugmf:
    image: ghcr.io/figgox/ugmf:latest
    container_name: ugmf
    restart: unless-stopped

    ports:
      # Change the left number if 3000 is taken, e.g. "8080:3000".
      - "3000:3000"

    # Reads SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET / TICKETMASTER_API_KEY
    # from here instead of hardcoding them below, so real keys never end up in
    # a file that's tracked by git. Create a .env.local next to this file
    # (copy .env.example) and fill in your values there.
    env_file:
      - .env.local

    environment:
      # Set this to your own zone. The container is UTC otherwise, which shifts
      # the "Tonight" cutoff and printed show times away from your wall clock.
      TZ: Etc/UTC

      # Optional. V8 grows its heap to whatever the host offers, so steady
      # state is around 280 MB on a roomy machine. Capping it holds the
      # container at roughly 175 MB instead, which survived 4000 requests here
      # without a single failure. Worth setting on a small NAS.
      # NODE_OPTIONS: "--max-old-space-size=128"

      # Optional. How often the background job refreshes real Spotify/
      # Ticketmaster data, in hours. Defaults to 12; never goes below 1
      # regardless of what's set here. Only relevant when the keys above
      # are set.
      # SYNC_INTERVAL_HOURS: "12"

    # With no API keys set, the app is stateless and this volume sits empty.
    # With keys set, this is where the background sync persists what it
    # pulls from Spotify/Ticketmaster, so a restart doesn't start back on
    # seed data — see README.
    volumes:
      - ugmf_data:/app/.data

    # A ceiling well clear of the measured plateau, so a runaway gets caught
    # without the container being killed in normal use.
    mem_limit: 512m

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ugmf_data:
