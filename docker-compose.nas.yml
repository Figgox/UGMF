# Paste-and-go UGMF for a NAS.
#
# This file needs nothing else — no source checkout, no Dockerfile, no build.
# It pulls a prebuilt image, so it works on a NAS with little RAM and runs on
# both x86 and ARM (the image is published for both).
#
# This file pulls an image, it does not build one. That image has to exist
# first, which takes two one-time steps on GitHub — not on the NAS:
#
#   1. Merge the branch to main. The publish workflow runs on pushes to main,
#      so merging is what builds and pushes the first image.
#   2. Make the package public: github.com/users/Figgox/packages -> ugmf ->
#      Package settings. GHCR packages are private by default. Otherwise
#      `docker login ghcr.io` on the NAS with a read:packages token.
#
# Before that, `up` fails with manifest unknown / denied — there is nothing
# at ghcr.io/figgox/ugmf yet.
#
#   docker compose -f docker-compose.nas.yml up -d
#
# Then open http://<your-nas-ip>:3000

services:
  ugmf:
    image: ghcr.io/figgox/ugmf:latest
    container_name: ugmf
    restart: unless-stopped

    ports:
      # Change the left number if 3000 is taken, e.g. "8080:3000".
      - "3000:3000"

    environment:
      # Set this to your own zone. The container is UTC otherwise, which shifts
      # the "Tonight" cutoff and printed show times away from your wall clock.
      TZ: Etc/UTC

      # Leave unset to run on the bundled dataset. The Spotify and Ticketmaster
      # adapters are scaffolded but not implemented yet — setting these makes
      # requests fail until they are written.
      # SPOTIFY_CLIENT_ID: ""
      # SPOTIFY_CLIENT_SECRET: ""
      # TICKETMASTER_API_KEY: ""

      # Optional. V8 grows its heap to whatever the host offers, so steady
      # state is around 280 MB on a roomy machine. Capping it holds the
      # container at roughly 175 MB instead, which survived 4000 requests here
      # without a single failure. Worth setting on a small NAS.
      # NODE_OPTIONS: "--max-old-space-size=128"

    # Nothing to mount: the app is stateless and the dataset is in the image.

    # A ceiling well clear of the measured plateau, so a runaway gets caught
    # without the container being killed in normal use.
    mem_limit: 512m

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
