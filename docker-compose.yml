services:
  ugmf:
    build: .
    image: ugmf:latest
    container_name: ugmf
    restart: unless-stopped

    ports:
      # Change the left number if 3000 is taken on your NAS — e.g. "8080:3000".
      - "3000:3000"

    # Reads SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET / TICKETMASTER_API_KEY
    # from here instead of hardcoding them below, so real keys never end up in
    # a file that's tracked by git. Create .env.local from .env.example and
    # fill in your values there.
    env_file:
      - .env.local

    environment:
      # Set this to your own zone. The container is UTC otherwise, which shifts
      # show times and the "Tonight" cutoff away from your wall clock — and
      # misreports real gig times now that the Ticketmaster provider is live.
      TZ: Etc/UTC

      # Optional. Holds the container near 175 MB instead of the ~280 MB V8
      # drifts to when the host has memory to spare. See the README.
      # NODE_OPTIONS: "--max-old-space-size=128"

      # Optional. How often the background job refreshes real Spotify/
      # Ticketmaster data, in hours. Defaults to 12; never goes below 1
      # regardless of what's set here — Spotify's rate limit is unforgiving.
      # Only relevant when the API keys above are set.
      # SYNC_INTERVAL_HOURS: "12"

    # With no API keys set, the app holds no state and this volume sits
    # empty — everything is baked into the image. With keys set, this is
    # where the background sync (see README) persists what it pulls from
    # Spotify/Ticketmaster, so a restart doesn't start back on seed data.
    volumes:
      - ugmf_data:/app/.data

    mem_limit: 512m

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ugmf_data:
